name: Update prices (quinzenal)

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update prices via Falcon
        run: python scripts/update_prices.py
        env:
          FALCON_TOKEN: ${{ secrets.FALCON_TOKEN }}
      - name: Commit prices.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza tabela quinzenal de precos"
          file_pattern: public/prices.json
